<!-- result.html: 結果画面。sessionStorageの診断結果を元に該当タイプの内容を表示する。 -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本酒パーソナリティ診断 | 結果</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- data.jsの16タイプデータを使うため、result.jsより先に読み込む -->
  <!-- budoux-ja要素・setPhraseText()を使うため、result.jsより先に読み込む -->
  <!-- sake-utils.jsの「おすすめの日本酒」描画関数を使うため、result.jsより先に読み込む -->
  <!-- share.jsはresult.jsが取得した診断結果（currentDiagnosisResult）を参照するため、result.jsの後に読み込む -->
  <script src="js/data.js" defer></script>
  <script src="js/vendor/budoux-ja.min.js" defer></script>
  <script src="js/text-utils.js" defer></script>
  <script src="js/sake-utils.js" defer></script>
  <script src="js/result.js" defer></script>
  <script src="js/share.js" defer></script>
  <script src="js/nav.js" defer></script>
</head>
<body>

  <!-- ページ間を自由に行き来できる共通ナビゲーション（3本線ボタンを押すとメニューが開く） -->
  <nav class="top-nav" aria-label="ページナビゲーション">
    <button type="button" id="navToggleButton" class="nav-toggle-button" aria-expanded="false" aria-controls="navMenu" aria-label="メニューを開く">
      <span class="nav-toggle-icon" aria-hidden="true"></span>
    </button>
    <div id="navMenu" class="nav-menu" hidden>
      <a href="index.html" class="top-nav-link"><budoux-ja>ホーム</budoux-ja></a>
      <a href="questions.html" class="top-nav-link"><budoux-ja>診断</budoux-ja></a>
      <a href="result.html" class="top-nav-link active"><budoux-ja>診断結果</budoux-ja></a>
      <a href="types.html" class="top-nav-link"><budoux-ja>タイプ一覧</budoux-ja></a>
    </div>
  </nav>

  <main class="page-wrapper result-page">
    <header class="site-header">
      <a href="index.html"><budoux-ja>日本酒パーソナリティ診断</budoux-ja></a>
    </header>

    <!-- 診断結果が取得できない・該当タイプが見つからない場合に表示するエラーエリア -->
    <div id="errorContainer" class="card error-message" hidden>
      <p><budoux-ja>診断結果を取得できませんでした。お手数ですが、最初からもう一度診断を行ってください。</budoux-ja></p>
      <a href="index.html" class="primary-button"><budoux-ja>トップ画面に戻る</budoux-ja></a>
    </div>

    <!-- 診断結果の表示エリア -->
    <div id="resultContainer" class="card result-container" hidden>

      <div id="resultHero" class="result-hero">
        <p class="type-code" id="typeCodeText"></p>
        <img id="typeImage" class="type-image" alt="">
        <h1 id="typeNameText" class="type-name"></h1>
      </div>

      <!-- 4軸それぞれのスコアを％表示するエリア（中身はresult.jsがscoresデータから動的に生成する） -->
      <section id="axisSection" class="result-section axis-section" hidden>
        <h2><budoux-ja>診断スコア</budoux-ja></h2>
        <div id="axisBars" class="axis-bars"></div>
      </section>

      <!-- PC幅では2列に並ぶ情報グリッド（性格・食事の傾向・好む食べ物・おすすめの日本酒） -->
      <div class="result-info-grid">
        <section class="result-section reveal-slide slide-in-up">
          <h2><budoux-ja>性格</budoux-ja></h2>
          <p id="descriptionText"></p>
        </section>

        <section class="result-section reveal-slide slide-in-up">
          <h2><budoux-ja>食事の傾向</budoux-ja></h2>
          <p id="dietDescriptionText"></p>
        </section>

        <section class="result-section foods-section reveal-slide slide-in-up">
          <h2><budoux-ja>好む食べ物</budoux-ja></h2>
          <ul id="favoriteFoodsList" class="foods-list"></ul>
        </section>

        <section class="result-section sake-section">
          <h2><budoux-ja>おすすめの日本酒</budoux-ja></h2>
          <!-- 銘柄ごとのカード（中身はresult.jsがsakeRecommendationsデータから動的に生成する） -->
          <div id="sakeRecommendationsList" class="sake-recommendations-list"></div>
        </section>
      </div>

      <div id="resultFooterActions" class="result-footer-actions">
        <!-- SNSシェア画像の生成エリア：Canvas APIでシェア用画像を作り、ワンタップでOSの共有画面からSNSへシェアする -->
        <section class="result-section share-section">
          <h2><budoux-ja>この結果をシェアする</budoux-ja></h2>
          <p class="share-description"><budoux-ja>ワンタップでInstagramやXにシェアしよう！</budoux-ja></p>

          <div class="share-buttons">
            <button type="button" id="shareOnInstagramButton" class="share-button share-button-instagram">
              <budoux-ja>Instagramでシェア</budoux-ja>
            </button>
            <button type="button" id="shareOnXButton" class="share-button share-button-x">
              <budoux-ja>Xでシェア</budoux-ja>
            </button>
          </div>

          <!-- ワンタップシェア（Web Share API）に対応していない環境向けの代替表示：画像プレビュー＋保存ボタン -->
          <div id="sharePreviewArea" class="share-preview-area" hidden>
            <p id="sharePreviewCaption" class="share-preview-caption"></p>
            <canvas id="shareCanvas" class="share-canvas"></canvas>
            <p class="share-fallback-note"><budoux-ja>お使いのブラウザは直接シェアに対応していないため、画像を保存してSNSアプリから投稿してください。</budoux-ja></p>
            <button type="button" id="downloadShareImageButton" class="primary-button download-button">
              <budoux-ja>画像を保存する</budoux-ja>
            </button>
          </div>
        </section>

        <div class="restart-area">
          <a href="index.html" id="restartLink" class="primary-button"><budoux-ja>もう一度診断する</budoux-ja></a>
        </div>
      </div>

    </div>

    <footer class="site-footer">
      <p><budoux-ja>&copy; 日本酒パーソナリティ診断</budoux-ja></p>
    </footer>
  </main>

</body>
</html>
